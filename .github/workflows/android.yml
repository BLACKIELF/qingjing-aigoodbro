name: android
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Set isolated build output
        run: echo "QINGJING_ANDROID_BUILD_DIR=$RUNNER_TEMP/qingjing-android/app" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.2"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: android-actions/setup-android@v3
      - name: Prepare Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Restore private signing key
        env:
          KEYSTORE_B64: ${{ secrets.QINGJING_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.QINGJING_KEY_PASSWORD }}
        run: |
          python - <<'PY'
          import os, base64
          from pathlib import Path
          folder = Path('.private/android-signing')
          folder.mkdir(parents=True, exist_ok=True)
          key = folder / 'qingjing-release.jks'
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE_B64']))
          password = os.environ['KEY_PASSWORD']
          assert password and key.stat().st_size > 0
          (folder / 'keystore.properties').write_text(f'storeFile={key.resolve()}\nstorePassword={password}\nkeyAlias=qingjing\nkeyPassword={password}\n')
          PY
      - name: Build and unit test signed APK
        working-directory: android
        run: |
          export CHAQUOPY_PYTHON="$(command -v python3.12 || command -v python3)"
          gradle --no-daemon --console=plain assembleRelease testReleaseUnitTest
      - name: Verify signature and application identity
        run: |
          mkdir -p delivery
          cp "$QINGJING_ANDROID_BUILD_DIR/outputs/apk/release/app-release.apk" delivery/Qingjing-AiGoodBro-1.0.0-1108v1-android-arm64.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs delivery/*.apk
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging delivery/*.apk | tee delivery/android-package-info.txt
          grep -q "package: name='com.aigoodbro.qingjing'" delivery/android-package-info.txt
          cd delivery
          sha256sum *.apk > SHA256SUMS-android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Qingjing-AiGoodBro-android-1108v1
          path: delivery/
          if-no-files-found: error
